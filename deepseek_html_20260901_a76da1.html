<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>延世韩国语3 - 完整词库版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 20px 20px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            margin: 4px 0;
        }
        .hidden {
            display: none !important;
        }

        .voice-status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 43, 60, 0.92);
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            gap: 10px;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
        }
        .voice-status.show {
            display: flex;
        }
        .voice-status .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a2b3c;
        }
        .subtitle {
            color: #6b7a8a;
            font-size: 13px;
            border-left: 4px solid #ffb74d;
            padding-left: 14px;
            background: #f8fafc;
            border-radius: 0 12px 12px 0;
            line-height: 1.5;
            margin: 4px 0 14px;
        }

        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            background: #f7f9fc;
            padding: 8px 14px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #2c3e50;
            border: 1px solid #e9edf2;
            align-items: center;
        }
        .stats-bar span {
            font-weight: 600;
            color: #1a2b3c;
        }
        .stats-bar .fav-count {
            color: #e67e22;
        }

        .mode-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 14px;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 10px;
        }
        .mode-tab {
            padding: 6px 14px;
            border-radius: 40px;
            background: #f1f4f8;
            color: #3d4e5f;
            font-weight: 600;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            touch-action: manipulation;
        }
        .mode-tab.active {
            background: #1a2b3c;
            color: white;
            box-shadow: 0 4px 12px rgba(26, 43, 60, 0.25);
        }

        .flashcard-container {
            perspective: 1200px;
            min-height: 340px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .flashcard {
            width: 100%;
            max-width: 680px;
            min-height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        .flashcard-face {
            position: absolute;
            width: 100%;
            min-height: 300px;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 2px solid #e9edf2;
            background: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }
        .flashcard-back {
            transform: rotateY(180deg);
        }
        .flashcard-face .label {
            font-size: 11px;
            font-weight: 600;
            color: #8899aa;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .flashcard-face .main-text {
            font-size: 28px;
            font-weight: 700;
            color: #0f1e2e;
            line-height: 1.4;
            word-break: keep-all;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', 'Segoe UI', sans-serif;
        }
        .flashcard-face .sub-text {
            font-size: 15px;
            color: #4d6272;
            margin-top: 10px;
            line-height: 1.6;
            max-width: 90%;
        }
        .flashcard-face .example {
            margin-top: 12px;
            padding: 12px 16px;
            background: #f5f8fc;
            border-radius: 12px;
            font-size: 14px;
            color: #1a2b3c;
            line-height: 1.6;
            width: 100%;
            max-width: 90%;
            text-align: left;
        }
        .flashcard-face .example .ko {
            font-weight: 600;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif;
        }
        .flashcard-face .example .zh {
            color: #4d6272;
            font-size: 13px;
            margin-top: 3px;
        }
        .flashcard-face .action-row {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .flashcard-face .action-row .btn {
            padding: 6px 16px;
            font-size: 12px;
        }
        .flashcard-counter {
            text-align: center;
            font-size: 13px;
            color: #6b7a8a;
            margin-top: 12px;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background: #eef2f6;
            color: #1f2e3f;
            touch-action: manipulation;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-primary {
            background: #1a2b3c;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #0f1e2e;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #d0d9e3;
        }
        .btn-outline:hover:not(:disabled) {
            background: #f2f6fc;
        }
        .btn-warning {
            background: #f39c12;
            color: white;
        }
        .btn-warning:hover:not(:disabled) {
            background: #d68910;
        }
        .btn-success {
            background: #2e7d5e;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #1f5f45;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 11px;
        }

        .speak-btn {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            transition: 0.15s;
            padding: 0 6px;
            touch-action: manipulation;
        }
        .speak-btn:hover {
            transform: scale(1.1);
        }
        .speak-btn:active {
            transform: scale(0.9);
        }

        .audio-only-icon {
            font-size: 80px;
            line-height: 1;
            animation: pulse 2s ease-in-out infinite;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .audio-only-icon:active {
            transform: scale(0.92);
        }
        .audio-only-icon .sub {
            font-size: 18px;
            color: #8899aa;
            display: block;
            margin-top: 12px;
            font-weight: 400;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .filter-area {
            margin: 8px 0 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .filter-area select {
            padding: 5px 12px;
            border-radius: 40px;
            border: 1.5px solid #dce3ec;
            font-size: 12px;
            background: white;
            outline: none;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif;
        }
        .word-count-badge {
            background: #dce5ef;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }

        .progress-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            gap: 10px;
        }
        .progress-info {
            font-size: 13px;
            color: #5a6e7e;
            background: #f2f6fc;
            padding: 4px 14px;
            border-radius: 40px;
        }
        .nav-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .nav-buttons .btn {
            padding: 5px 14px;
            font-size: 12px;
        }

        .favorite-list-area {
            margin-top: 14px;
            padding: 10px 14px;
            background: #fefcf5;
            border-radius: 14px;
            border: 1px solid #f0e8d8;
            display: none;
        }
        .favorite-list-area.show {
            display: block;
        }
        .favorite-list-area h4 {
            font-size: 13px;
            color: #8a7a5a;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .fav-item {
            display: inline-block;
            background: #f5f0e8;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 12px;
            margin: 2px 3px 2px 0;
            color: #3d2e1a;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif;
        }

        .test-container {
            padding: 8px 0;
        }
        .test-question {
            background: #f8fafc;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid #e9edf2;
            transition: 0.2s;
        }
        .test-question.correct {
            border-left: 5px solid #2e7d5e;
            background: #f0faf5;
        }
        .test-question.wrong {
            border-left: 5px solid #c0392b;
            background: #fdf0ef;
        }
        .test-question .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            font-size: 12px;
            color: #6b7a8a;
            margin-bottom: 4px;
        }
        .test-question .q-text {
            font-size: 16px;
            font-weight: 600;
            color: #0f1e2e;
            margin-bottom: 8px;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif;
        }
        .test-question .q-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .test-question .q-options .opt {
            padding: 8px 14px;
            border-radius: 10px;
            border: 2px solid #dce3ec;
            background: white;
            cursor: pointer;
            transition: 0.15s;
            font-size: 14px;
            touch-action: manipulation;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif;
        }
        .test-question .q-options .opt:hover:not(.disabled) {
            border-color: #1a2b3c;
            background: #f7f9fc;
        }
        .test-question .q-options .opt.selected {
            border-color: #1a2b3c;
            background: #e8ecf2;
        }
        .test-question .q-options .opt.correct-answer {
            border-color: #2e7d5e;
            background: #e6f5ed;
        }
        .test-question .q-options .opt.wrong-answer {
            border-color: #c0392b;
            background: #fdeaea;
        }
        .test-question .q-options .opt.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .test-question .q-feedback {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            line-height: 1.5;
        }
        .test-question .q-feedback.show {
            display: block;
        }
        .test-question .q-feedback.correct {
            background: #e6f5ed;
            color: #1a5a3e;
        }
        .test-question .q-feedback.wrong {
            background: #fdeaea;
            color: #8a2a1a;
        }
        .test-result {
            text-align: center;
            padding: 24px 16px;
            background: #f8fafc;
            border-radius: 20px;
            border: 2px solid #e9edf2;
        }
        .test-result .score {
            font-size: 52px;
            font-weight: 800;
            color: #1a2b3c;
        }
        .test-result .score-label {
            font-size: 16px;
            color: #4d6272;
            margin-top: 4px;
        }
        .test-result .score-detail {
            font-size: 14px;
            color: #6b7a8a;
            margin-top: 8px;
        }
        .test-result .btn {
            margin-top: 12px;
        }
        .test-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .test-timer {
            font-size: 14px;
            font-weight: 600;
            color: #1a2b3c;
            background: #f2f6fc;
            padding: 4px 16px;
            border-radius: 40px;
        }

        .flashcard-area-wrap.hidden {
            display: none;
        }

        /* 收藏统计 */
        .round-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f0f4fa;
            padding: 4px 14px 4px 10px;
            border-radius: 40px;
            font-size: 12px;
            color: #2c3e50;
        }
        .round-progress .round-num {
            background: #1a2b3c;
            color: white;
            padding: 1px 10px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 12px;
        }
        .round-progress .status {
            color: #6b7a8a;
            font-size: 11px;
        }

        @media (max-width: 600px) {
            .app-container {
                padding: 12px;
            }
            .flashcard-face .main-text {
                font-size: 22px;
            }
            .test-question .q-options {
                grid-template-columns: 1fr;
            }
            .test-result .score {
                font-size: 38px;
            }
            .audio-only-icon {
                font-size: 56px;
            }
            .flashcard-face {
                padding: 18px 14px;
                min-height: 260px;
            }
            .flashcard-container {
                min-height: 300px;
            }
            .mode-tab {
                padding: 4px 10px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">

        <!-- ===== 语音状态提示 ===== -->
        <div class="voice-status" id="voiceStatus">
            <span class="spinner"></span>
            <span id="voiceStatusText">🔊 正在播放语音...</span>
        </div>

        <!-- ===== 学习端 ===== -->
        <div id="studySection">
            <div class="header-row">
                <h1>📘 延世韩国语3</h1>
                <div class="round-progress">
                    <span class="round-num" id="currentRoundDisplay">第1轮</span>
                    <span class="status" id="roundStatus">📖 学习新词</span>
                </div>
            </div>
            <div class="subtitle">智能多轮复习 · 每轮独立打乱 · 直到完全掌握</div>

            <div class="stats-bar">
                <div>📚 总单词 <span id="wordCount">0</span></div>
                <div>🧩 总语法 <span id="grammarCount">0</span></div>
                <div>⭐ 收藏 <span class="fav-count" id="favTotalCount">0</span></div>
                <div>📌 <span id="currentModeLabel">韩语→中文</span></div>
                <div>🎯 <span id="masteryDisplay">0% 掌握</span></div>
            </div>

            <div class="mode-tabs" id="modeTabs">
                <button class="mode-tab active" data-mode="0">🇰🇷→🇨🇳 韩语闪卡</button>
                <button class="mode-tab" data-mode="1">🇨🇳→🇰🇷 中文闪卡</button>
                <button class="mode-tab" data-mode="2">🔊 语音闪卡</button>
                <button class="mode-tab" data-mode="3">🧩 语法闪卡</button>
                <button class="mode-tab" data-mode="4">📝 综合测试</button>
            </div>

            <div class="filter-area" id="filterArea">
                <select id="topicFilter"><option value="all">📂 全部主题</option></select>
                <select id="typeFilter"><option value="all">📖 全部类型</option><option value="word">单词</option><option value="grammar">语法</option></select>
                <select id="favoriteFilter"><option value="all">全部</option><option value="fav">⭐ 仅收藏</option></select>
                <span class="word-count-badge" id="filteredCount">0 项</span>
                <button class="btn btn-sm btn-outline" id="advanceRoundBtn">⏩ 下一轮</button>
            </div>

            <!-- 闪卡区域 -->
            <div class="flashcard-area-wrap" id="flashcardArea">
                <div class="flashcard-container">
                    <div class="flashcard" id="flashcard">
                        <div class="flashcard-face" id="cardFront">
                            <div class="label" id="frontLabel">📖 单词</div>
                            <div class="main-text" id="frontMain">준비 중...</div>
                            <div class="sub-text" id="frontSub"></div>
                            <div class="action-row">
                                <button class="speak-btn" id="speakFrontBtn" aria-label="播放语音">🔊</button>
                                <button class="btn btn-outline" id="flipBtn">🔄 翻转</button>
                            </div>
                        </div>
                        <div class="flashcard-face flashcard-back" id="cardBack">
                            <div class="label" id="backLabel">📖 单词 · 背面</div>
                            <div class="main-text" id="backMain">뒤집기</div>
                            <div class="sub-text" id="backSub"></div>
                            <div class="example" id="backExample" style="display:none;">
                                <div class="ko" id="exampleKo"></div>
                                <div class="zh" id="exampleZh"></div>
                            </div>
                            <div class="action-row">
                                <button class="speak-btn" id="speakBackBtn" aria-label="播放语音">🔊</button>
                                <button class="btn btn-warning" id="favCardBtn">⭐ 收藏</button>
                                <button class="btn btn-success" id="masteredBtn">✅ 已掌握</button>
                                <button class="btn btn-outline" id="flipBackBtn">🔄 翻转</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flashcard-counter" id="cardCounter">1 / 10</div>
            </div>

            <!-- 测试区域 -->
            <div class="flashcard-area-wrap hidden" id="testArea">
                <div class="test-controls">
                    <button class="btn btn-primary" id="startTestBtn">📝 开始新测试</button>
                    <span class="test-timer" id="testTimer">⏱️ 00:00</span>
                    <span class="word-count-badge" id="testProgress">0 / 0 题</span>
                </div>
                <div id="testContainer" class="test-container"></div>
            </div>

            <div class="favorite-list-area" id="favListArea">
                <h4>
                    <span>⭐ 收藏列表 <span id="favListCount">0</span></span>
                    <span>
                        <button class="btn btn-sm btn-outline" id="favPracticeBtn">📖 收藏专项练习</button>
                        <button class="btn btn-sm btn-outline" id="clearFavBtn">清空</button>
                    </span>
                </h4>
                <div id="favListContainer"></div>
            </div>

            <div class="progress-controls" id="progressControls">
                <div class="progress-info"><span id="progressText">0 / 0</span></div>
                <div class="nav-buttons">
                    <button class="btn btn-outline" id="prevBtn">◀ 上一张</button>
                    <button class="btn btn-outline" id="nextBtn">下一张 ▶</button>
                    <button class="btn btn-outline" id="resetBtn">🔄 重来</button>
                    <button class="btn btn-outline" id="favToggleBtn">⭐ 收藏列表</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 语音引擎
        // ============================================================
        const VoiceEngine = {
            isSpeaking: false,
            currentUtterance: null,
            statusElement: document.getElementById('voiceStatus'),
            statusText: document.getElementById('voiceStatusText'),
            statusTimer: null,
            preferredVoice: null,
            voiceLoaded: false,

            isSupported() { return 'speechSynthesis' in window || 'webkitSpeechSynthesis' in window; },
            getSynth() { return window.speechSynthesis || window.webkitSpeechSynthesis || null; },

            showStatus(text, show) {
                const el = this.statusElement;
                const txt = this.statusText;
                if (show) { txt.textContent = text || '🔊 正在播放语音...'; el.classList.add('show');
                    clearTimeout(this.statusTimer); } else { el.classList.remove('show'); }
            },
            hideStatusAfter(delay) { clearTimeout(this.statusTimer); this.statusTimer = setTimeout(() => { this
                    .showStatus('', false); }, delay || 500); },

            getBestKoreanVoice() {
                const synth = this.getSynth();
                if (!synth) return null;
                const voices = synth.getVoices();
                if (!voices || voices.length === 0) return null;
                const femaleKeywords = ['female', 'girl', 'woman', '여성', '여자', 'Yuna', 'Nara', 'Sora', 'Minji',
                    'Hana', 'Seoyeon'
                ];
                const scoredVoices = voices.filter(v => v.lang && v.lang.startsWith('ko')).map(v => {
                    let score = 0;
                    const name = (v.name || '').toLowerCase();
                    for (const kw of femaleKeywords) { if (name.includes(kw.toLowerCase())) { score += 10;
                            break; } }
                    if (name.includes('google') || name.includes('apple') || name.includes('microsoft'))
                        score += 4;
                    if (v.localService) score += 2;
                    return { voice: v, score: score };
                }).sort((a, b) => b.score - a.score);
                if (scoredVoices.length > 0) return scoredVoices[0].voice;
                return voices.find(v => v.lang && v.lang.startsWith('ko')) || null;
            },

            loadBestVoice() {
                const synth = this.getSynth();
                if (!synth) return;
                if (this.voiceLoaded) { this.preferredVoice = this.getBestKoreanVoice(); return; }
                this.preferredVoice = this.getBestKoreanVoice();
                if (this.preferredVoice) { this.voiceLoaded = true; return; }
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = () => { this.preferredVoice = this.getBestKoreanVoice();
                        this.voiceLoaded = true; };
                } else { setTimeout(() => { this.preferredVoice = this.getBestKoreanVoice();
                        this.voiceLoaded = true; }, 200); }
            },

            speak(text, options = {}) {
                return new Promise((resolve) => {
                    if (!text || text.trim() === '') { resolve(); return; }
                    const synth = this.getSynth();
                    if (!synth) { resolve(); return; }
                    this.cancel();
                    try {
                        let utterance = new(window.SpeechSynthesisUtterance || window
                        .webkitSpeechSynthesisUtterance)(text);
                        utterance.lang = options.lang || 'ko-KR';
                        if (this.preferredVoice) utterance.voice = this.preferredVoice;
                        else { this.preferredVoice = this.getBestKoreanVoice();
                            if (this.preferredVoice) utterance.voice = this.preferredVoice; }
                        utterance.rate = options.rate || 0.85;
                        utterance.pitch = options.pitch || 1.05;
                        utterance.volume = options.volume || 1;
                        utterance.onstart = () => { this.isSpeaking = true;
                            this.showStatus('🔊 正在播放...', true); };
                        utterance.onend = () => { this.isSpeaking = false;
                            this.showStatus('✅ 播放完成', true);
                            this.hideStatusAfter(600);
                            resolve(); };
                        utterance.onerror = () => { this.isSpeaking = false;
                            resolve(); };
                        this.currentUtterance = utterance;
                        synth.speak(utterance);
                        setTimeout(() => { if (this.isSpeaking) { this.isSpeaking = false;
                                resolve(); } }, 10000);
                    } catch (e) { resolve(); }
                });
            },
            cancel() { const synth = this.getSynth(); if (synth) { try { synth.cancel(); } catch (e) {} }
                this.isSpeaking = false;
                this.currentUtterance = null;
                this.showStatus('', false); },
            preload() { const synth = this.getSynth(); if (!synth) return; this.loadBestVoice(); try { const dummy =
                    new(window.SpeechSynthesisUtterance || window.webkitSpeechSynthesisUtterance)(' ');
                    dummy.lang = 'ko-KR';
                    dummy.volume = 0;
                    if (this.preferredVoice) dummy.voice = this.preferredVoice;
                    synth.speak(dummy);
                    setTimeout(() => { try { synth.cancel(); } catch (e) {} }, 150); } catch (e) {} }
        };

            document.removeEventListener('touchstart', initVoiceOnInteraction); }

            { korean: '-는다면서요?', chinese: '听说……？', topic: '其他重要结构', type: 'grammar',
                example: '한국에 간다면서요?' },
            { korean: '-는다는 것이', chinese: '本想……却……；结果……', topic: '其他重要结构', type: 'grammar',
                example: '도와준다는 것이 오히려 방해가 됐어요.' },
            { korean: '-듯이', chinese: '像……一样；如同……', topic: '其他重要结构', type: 'grammar',
                example: '보시는 바와 같이 결과가 좋습니다.' }
        ];

        // 合并所有数据
        const allItems = [...wordItems, ...grammarItems];

        // ============================================================
        // 核心状态
        // ============================================================
        let currentIndex = 0;
        let filteredItems = [];
        let currentItem = null;
        let isFlipped = false;
        let favorites = [];
        let isFavPracticeMode = false;
        let currentMode = 0;
        let testQuestions = [];
        let testAnswers = [];
        let testStarted = false;
        let testSubmitted = false;
        let timerInterval = null;
        let seconds = 0;
        let masteredItems = [];

        // ============================================================
        // 工具函数
        // ============================================================
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getTopics() {
            const set = new Set();
            allItems.forEach(item => { if (item.topic) set.add(item.topic); });
            return [...set];
        }

        function isFavorite(item) {
            if (!item) return false;
            return favorites.some(f => f.korean === item.korean && f.chinese === item.chinese);
        }

        function toggleFavorite(item) {
            if (!item) return;
            const idx = favorites.findIndex(f => f.korean === item.korean && f.chinese === item.chinese);
            if (idx >= 0) {
                favorites.splice(idx, 1);
            } else {
                favorites.push({ korean: item.korean, chinese: item.chinese, type: item.type, topic: item.topic });
            }
            saveFavorites();
            renderFavList();
            updateStats();
        }

        function saveFavorites() {
            try {
                localStorage.setItem('yonsei_favorites', JSON.stringify(favorites));
            } catch (e) {}
        }

        function loadFavorites() {
            try {
                const data = localStorage.getItem('yonsei_favorites');
                if (data) {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed)) favorites = parsed;
                }
            } catch (e) {}
        }

        function saveMastered() {
            try {
                localStorage.setItem('yonsei_mastered', JSON.stringify(masteredItems));
            } catch (e) {}
        }

        function loadMastered() {
            try {
                const data = localStorage.getItem('yonsei_mastered');
                if (data) {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed)) masteredItems = parsed;
                }
            } catch (e) {}
        }

        function getItemsForMode(mode) {
            const topic = document.getElementById('topicFilter')?.value || 'all';
            const type = document.getElementById('typeFilter')?.value || 'all';
            const favFilter = document.getElementById('favoriteFilter')?.value || 'all';

            let items = [];
            if (mode === 3) {
                items = [...grammarItems];
            } else if (mode === 4) {
                items = [...allItems];
            } else {
                items = [...wordItems];
            }

            if (topic !== 'all') {
                items = items.filter(item => item.topic === topic);
            }
            if (type !== 'all' && mode !== 3) {
                items = items.filter(item => item.type === type);
            }
            if (favFilter === 'fav') {
                items = items.filter(item => isFavorite(item));
            }

            if (isFavPracticeMode) {
                items = items.filter(item => isFavorite(item));
                if (items.length === 0) {
                    isFavPracticeMode = false;
                    return getItemsForMode(mode);
                }
            }

            return shuffleArray([...items]);
        }

        function getExampleForItem(item) {
            if (item.example) {
                return { ko: item.example, zh: '' };
            }
            return { ko: `${item.korean} (예문)`, zh: '' };
        }

        // ============================================================
        // 渲染函数
        // ============================================================
        function renderCard(item, mode) {
            if (!item) {
                document.getElementById('frontMain').textContent = '🎉 所有卡片已完成！';
                document.getElementById('frontSub').textContent = '点击"下一轮"进入新一轮复习';
                document.getElementById('backMain').textContent = '恭喜完成！';
                document.getElementById('backSub').textContent = '';
                document.getElementById('backExample').style.display = 'none';
                document.getElementById('favCardBtn').style.display = 'none';
                document.getElementById('masteredBtn').style.display = 'none';
                return;
            }

            const isGram = item.type === 'grammar';
            const label = isGram ? '🧩 语法' : '📖 单词';
            const isFav = isFavorite(item);
            const isMastered = masteredItems.some(m => m.korean === item.korean && m.chinese === item.chinese);

            document.getElementById('favCardBtn').textContent = isFav ? '⭐ 已收藏' : '☆ 收藏';
            document.getElementById('favCardBtn').style.display = 'inline-block';
            document.getElementById('masteredBtn').textContent = isMastered ? '✅ 已掌握' : '✅ 掌握';
            document.getElementById('masteredBtn').style.display = 'inline-block';

            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');

            if (mode === 2) {
                document.getElementById('frontLabel').textContent = '🔊 语音闪卡 · 正面';
                document.getElementById('frontMain').innerHTML = `
                        <div class="audio-only-icon" onclick="playAudio()">
                            🔊
                            <span class="sub">点击喇叭播放音频</span>
                        </div>
                    `;
                document.getElementById('frontMain').style.fontSize = 'inherit';
                document.getElementById('frontSub').textContent = '👆 点击翻转查看答案';
                document.getElementById('speakFrontBtn').style.display = 'none';
                document.getElementById('backLabel').textContent = '🔊 语音闪卡 · 背面';
                document.getElementById('backMain').textContent = item.korean + ' → ' + item.chinese;
                document.getElementById('backMain').style.fontSize = '28px';
                document.getElementById('backSub').textContent = isGram ? '语法：' + item.korean : '';
                const ex = getExampleForItem(item);
                document.getElementById('backExample').style.display = 'block';
                document.getElementById('exampleKo').textContent = ex.ko;
                document.getElementById('exampleZh').textContent = ex.zh;
                window.playAudio = function() { VoiceEngine.speak(item.korean).catch(() => {}); };
                return;
            }

            document.getElementById('frontMain').innerHTML = '';
            document.getElementById('frontMain').style.fontSize = '';
            document.getElementById('speakFrontBtn').style.display = 'inline-block';

            if (mode === 0) {
                document.getElementById('frontLabel').textContent = label + ' · 正面';
                document.getElementById('frontMain').textContent = item.korean;
                document.getElementById('frontSub').textContent = '点击翻转查看中文';
                document.getElementById('backLabel').textContent = label + ' · 背面';
                document.getElementById('backMain').textContent = item.chinese;
                document.getElementById('backSub').textContent = isGram ? '语法用法' : '中文释义';
            } else if (mode === 1) {
                document.getElementById('frontLabel').textContent = label + ' · 正面';
                document.getElementById('frontMain').textContent = item.chinese;
                document.getElementById('frontSub').textContent = '点击翻转查看韩语';
                document.getElementById('speakFrontBtn').style.display = 'none';
                document.getElementById('backLabel').textContent = label + ' · 背面';
                document.getElementById('backMain').textContent = item.korean;
                document.getElementById('backSub').textContent = isGram ? '语法形式' : '韩语表达';
            } else if (mode === 3) {
                document.getElementById('frontLabel').textContent = '🧩 语法闪卡 · 正面';
                document.getElementById('frontMain').textContent = item.korean;
                document.getElementById('frontMain').style.fontSize = '34px';
                document.getElementById('frontSub').textContent = '点击翻转查看中文释义';
                document.getElementById('backLabel').textContent = '🧩 语法闪卡 · 背面';
                document.getElementById('backMain').textContent = item.chinese;
                document.getElementById('backMain').style.fontSize = '28px';
                document.getElementById('backSub').textContent = '语法用法';
            }

            const ex = getExampleForItem(item);
            if (ex.ko) {
                document.getElementById('backExample').style.display = 'block';
                document.getElementById('exampleKo').textContent = ex.ko;
                document.getElementById('exampleZh').textContent = ex.zh;
            } else {
                document.getElementById('backExample').style.display = 'none';
            }

            const total = filteredItems.length;
            document.getElementById('cardCounter').textContent = `${currentIndex + 1} / ${total}`;
            document.getElementById('progressText').textContent = `${currentIndex + 1} / ${total}`;
        }

        function showCard(index) {
            if (filteredItems.length === 0) {
                document.getElementById('frontMain').textContent = '🎉 所有卡片已完成！';
                document.getElementById('frontSub').textContent = '点击"下一轮"进入新一轮复习';
                document.getElementById('cardCounter').textContent = '0 / 0';
                document.getElementById('progressText').textContent = '0 / 0';
                return;
            }
            if (index < 0) index = 0;
            if (index >= filteredItems.length) index = filteredItems.length - 1;
            currentIndex = index;
            currentItem = filteredItems[currentIndex];
            renderCard(currentItem, currentMode);
            updateStats();
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function updateStats() {
            const wordCount = wordItems.length;
            const grammarCount = grammarItems.length;
            document.getElementById('wordCount').textContent = wordCount;
            document.getElementById('grammarCount').textContent = grammarCount;

            const favCount = favorites.length;
            document.getElementById('favTotalCount').textContent = favCount;
            document.getElementById('studyFavCount').textContent = '⭐ ' + favCount;

            const total = allItems.length;
            const masteredCount = masteredItems.length;
            const pct = total > 0 ? Math.min(100, Math.round((masteredCount / total) * 100)) : 0;
            document.getElementById('masteryDisplay').textContent = pct + '% 掌握';

            const round = 1;
            document.getElementById('currentRoundDisplay').textContent = '第' + round + '轮';
            document.getElementById('currentModeLabel').textContent = ['韩语→中文', '中文→韩语', '语音闪卡', '语法闪卡',
                '综合测试'
            ][currentMode] || '未知';
        }

        function handlePrev() {
            if (filteredItems.length === 0 || currentMode === 4) return;
            if (currentIndex > 0) {
                currentIndex--;
                showCard(currentIndex);
            } else {
                currentIndex = filteredItems.length - 1;
                showCard(currentIndex);
            }
        }

        function handleNext() {
            if (filteredItems.length === 0 || currentMode === 4) return;
            if (currentIndex < filteredItems.length - 1) {
                currentIndex++;
                showCard(currentIndex);
            } else {
                filteredItems = getItemsForMode(currentMode);
                shuffleArray(filteredItems);
                currentIndex = 0;
                showCard(currentIndex);
            }
        }

        function handleReset() {
            if (currentMode === 4) return;
            filteredItems = getItemsForMode(currentMode);
            shuffleArray(filteredItems);
            currentIndex = 0;
            showCard(currentIndex);
        }

        function handleMastered() {
            if (!currentItem || currentMode === 4) return;
            const exists = masteredItems.some(m => m.korean === currentItem.korean && m.chinese === currentItem
                .chinese);
            if (!exists) {
                masteredItems.push({ korean: currentItem.korean, chinese: currentItem.chinese, type: currentItem
                        .type });
                saveMastered();

                const key = currentItem.korean + '|||' + currentItem.chinese;
                filteredItems = filteredItems.filter(item => (item.korean + '|||' + item.chinese) !== key);
                if (filteredItems.length === 0) {
                    document.getElementById('frontMain').textContent = '🎉 本轮所有卡片已完成！';
                    document.getElementById('frontSub').textContent = '点击"下一轮"进入新一轮复习';
                    document.getElementById('cardCounter').textContent = '0 / 0';
                    document.getElementById('progressText').textContent = '0 / 0';
                    updateStats();
                    return;
                }
                if (currentIndex >= filteredItems.length) {
                    currentIndex = filteredItems.length - 1;
                }
                showCard(currentIndex);
                updateStats();
            }
        }

        function handleFavCard() {
            if (!currentItem || currentMode === 4) return;
            toggleFavorite(currentItem);
            renderCard(currentItem, currentMode);
        }

        function renderFavList() {
            const container = document.getElementById('favListContainer');
            document.getElementById('favListCount').textContent = favorites.length;
            if (favorites.length === 0) {
                container.innerHTML = '<span style="color:#aaa;font-size:14px;">暂无收藏</span>';
                return;
            }
            container.innerHTML = favorites.map((f, i) =>
                `<span class="fav-item" data-idx="${i}">${f.korean} → ${f.chinese}</span>`
            ).join('');
            document.querySelectorAll('.fav-item').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    const fav = favorites[idx];
                    const found = allItems.findIndex(item => item.korean === fav.korean && item.chinese === fav
                        .chinese);
                    if (found >= 0) {
                        document.getElementById('topicFilter').value = 'all';
                        document.getElementById('typeFilter').value = 'all';
                        document.getElementById('favoriteFilter').value = 'all';
                        applyFilters();
                        const pos = filteredItems.findIndex(item => item.korean === fav.korean && item
                            .chinese === fav.chinese);
                        if (pos >= 0) {
                            currentIndex = pos;
                            showCard(currentIndex);
                        }
                    }
                });
            });
        }

        function startFavPractice() {
            if (favorites.length === 0) {
                alert('收藏夹为空，请先收藏一些单词或语法！');
                return;
            }
            isFavPracticeMode = true;
            switchMode(0);
            filteredItems = getItemsForMode(currentMode);
            currentIndex = 0;
            if (filteredItems.length > 0) showCard(currentIndex);
            updateStats();
            document.getElementById('roundStatus').textContent = '⭐ 收藏专项练习 (' + filteredItems.length + ' 项)';
        }

        function clearFavorites() {
            if (!confirm('确定要清空所有收藏吗？')) return;
            favorites = [];
            saveFavorites();
            renderFavList();
            updateStats();
            if (currentItem) renderCard(currentItem, currentMode);
        }

        function handleAdvanceRound() {
            const total = allItems.length;
            const masteredCount = masteredItems.length;
            if (masteredCount < total) {
                if (!confirm(`还有 ${total - masteredCount} 个卡片未掌握，确定要进入下一轮吗？`)) return;
            }
            masteredItems = [];
            saveMastered();
            isFavPracticeMode = false;
            filteredItems = getItemsForMode(currentMode);
            currentIndex = 0;
            showCard(currentIndex);
            updateStats();
            renderFavList();
            alert('进入新一轮！所有卡片重新打乱。');
        }

        function populateFilters() {
            const topics = getTopics();
            const topicFilter = document.getElementById('topicFilter');
            topicFilter.innerHTML = '<option value="all">📂 全部主题</option>';
            topics.forEach(t => {
                topicFilter.innerHTML += `<option value="${t}">${t}</option>`;
            });
            topicFilter.innerHTML += `<option value="语法">🧩 语法</option>`;
        }

        function applyFilters() {
            if (currentMode === 4) return;
            filteredItems = getItemsForMode(currentMode);
            currentIndex = 0;
            if (filteredItems.length === 0) {
                document.getElementById('frontMain').textContent = '没有匹配的卡片';
                document.getElementById('frontSub').textContent = '请调整筛选条件';
                document.getElementById('cardCounter').textContent = '0 / 0';
                document.getElementById('filteredCount').textContent = '0 项';
                return;
            }
            document.getElementById('filteredCount').textContent = `${filteredItems.length} 项`;
            showCard(currentIndex);
        }

        // ============================================================
        // 测试系统
        // ============================================================
        function generateTest() {
            const shuffledWords = shuffleArray([...wordItems]);
            const shuffledGrammars = shuffleArray([...grammarItems]);
            const usedWords = new Set();
            const questions = [];

            // 选词填空
            let fillBlankCount = 0;
            for (const w of shuffledWords) {
                if (fillBlankCount >= 4) break;
                if (usedWords.has(w.korean)) continue;
                usedWords.add(w.korean);
                const options = shuffleArray([w.chinese, ...shuffleArray([...wordItems]).filter(x => !usedWords.has(x
                    .korean)).slice(0, 3).map(x => x.chinese).filter(x => x !== w.chinese)]);
                const finalOpts = shuffleArray([w.chinese, ...options.filter(x => x !== w.chinese).slice(0, 3)]);
                while (finalOpts.length < 4) {
                    const extra = shuffleArray([...wordItems]).find(x => !finalOpts.includes(x.chinese) && !usedWords
                        .has(x.korean));
                    if (extra) finalOpts.push(extra.chinese);
                    else break;
                }
                questions.push({
                    type: 'fill_blank',
                    question: `"${w.korean}"의 올바른 뜻은?`,
                    answer: w.chinese,
                    options: shuffleArray(finalOpts.slice(0, 4)),
                    explanation: `"${w.korean}"은(는) "${w.chinese}"(으)로 해석됩니다.`
                });
                fillBlankCount++;
            }

            // 选择单词
            let selectWordCount = 0;
            for (const w of shuffledWords) {
                if (selectWordCount >= 4) break;
                if (usedWords.has(w.korean)) continue;
                usedWords.add(w.korean);
                const options = shuffleArray([w.korean, ...shuffleArray([...wordItems]).filter(x => !usedWords.has(x
                    .korean)).slice(0, 3).map(x => x.korean).filter(x => x !== w.korean)]);
                const finalOpts = shuffleArray([w.korean, ...options.filter(x => x !== w.korean).slice(0, 3)]);
                while (finalOpts.length < 4) {
                    const extra = shuffleArray([...wordItems]).find(x => !finalOpts.includes(x.korean) && !usedWords
                        .has(x.korean));
                    if (extra) finalOpts.push(extra.korean);
                    else break;
                }
                questions.push({
                    type: 'select_word',
                    question: `"${w.chinese}"의 올바른 한국어 단어는?`,
                    answer: w.korean,
                    options: shuffleArray(finalOpts.slice(0, 4)),
                    explanation: `"${w.chinese}"은(는) 한국어로 "${w.korean}"입니다.`
                });
                selectWordCount++;
            }

            // 语法
            let grammarCount = 0;
            for (const g of shuffledGrammars) {
                if (grammarCount >= 4) break;
                const opts = shuffleArray([g.chinese, ...shuffleArray([...grammarItems]).filter(x => x.korean !== g
                    .korean).slice(0, 3).map(x => x.chinese).filter(x => x !== g.chinese)]);
                while (opts.length < 4) {
                    const extra = shuffleArray([...grammarItems]).find(x => !opts.includes(x.chinese) && x.korean !==
                        g.korean);
                    if (extra) opts.push(extra.chinese);
                    else break;
                }
                questions.push({
                    type: 'grammar',
                    question: `다음 중 "${g.korean}"의 올바른 의미는?`,
                    answer: g.chinese,
                    options: shuffleArray(opts.slice(0, 4)),
                    explanation: `"${g.korean}"은(는) "${g.chinese}"(으)로 사용됩니다.`
                });
                grammarCount++;
            }

            if (questions.length === 0) {
                alert('词条数量不足，无法生成测试。请至少添加5个单词和5个语法。');
                return [];
            }

            return shuffleArray(questions);
        }

        function startTest() {
            if (timerInterval) { clearInterval(timerInterval);
                timerInterval = null; }
            seconds = 0;
            document.getElementById('testTimer').textContent = '⏱️ 00:00';
            testStarted = true;
            testSubmitted = false;
            testQuestions = generateTest();
            if (testQuestions.length === 0) {
                document.getElementById('testContainer').innerHTML =
                    '<p style="text-align:center;color:#6b7a8a;padding:30px 0;">词条数量不足，请添加更多词条</p>';
                return;
            }
            testAnswers = testQuestions.map(() => null);
            renderTest();
            document.getElementById('testProgress').textContent = `0 / ${testQuestions.length} 题`;
            timerInterval = setInterval(() => {
                seconds++;
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                document.getElementById('testTimer').textContent = `⏱️ ${m}:${s}`;
            }, 1000);
        }

        function renderTest() {
            const container = document.getElementById('testContainer');
            if (testQuestions.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#6b7a8a;padding:30px 0;">没有足够的题目</p>';
                return;
            }
            let html = '';
            testQuestions.forEach((q, idx) => {
                const answered = testAnswers[idx] !== null;
                const isCorrect = answered && testAnswers[idx] === q.answer;
                const isWrong = answered && testAnswers[idx] !== q.answer;
                const statusClass = isCorrect ? 'correct' : (isWrong ? 'wrong' : '');
                html += `
                        <div class="test-question ${statusClass}" id="q_${idx}">
                            <div class="q-header">
                                <span>${getQuestionTypeLabel(q.type)} · 第 ${idx+1} 题</span>
                                <span>${answered ? (isCorrect ? '✅ 正确' : '❌ 错误') : '⏳ 未作答'}</span>
                            </div>
                            <div class="q-text">${q.question}</div>
                            <div class="q-options">
                                ${q.options.map(opt => `
                                        <div class="opt ${answered && opt === q.answer ? 'correct-answer' : ''} ${answered && testAnswers[idx] === opt && opt !== q.answer ? 'wrong-answer' : ''} ${answered ? 'disabled' : ''} ${testAnswers[idx] === opt ? 'selected' : ''}"
                                             onclick="${answered ? '' : `selectTestOption(${idx}, '${opt.replace(/"/g, '\\"')}')`}">
                                            ${opt}
                                        </div>
                                    `).join('')}
                            </div>
                            <div class="q-feedback ${answered ? 'show' : ''} ${isCorrect ? 'correct' : (isWrong ? 'wrong' : '')}">
                                ${answered ? (isCorrect ? '✅ 正确！' : `❌ 正确答案: ${q.answer}`) : ''}
                                ${answered ? `<br><span style="font-size:13px;color:#6b7a8a;">📖 ${q.explanation || ''}</span>` : ''}
                            </div>
                        </div>
                    `;
            });
            container.innerHTML = html;
            const answeredCount = testAnswers.filter(a => a !== null).length;
            document.getElementById('testProgress').textContent = `${answeredCount} / ${testQuestions.length} 题`;
            if (answeredCount === testQuestions.length && !testSubmitted) {
                testSubmitted = true;
                if (timerInterval) { clearInterval(timerInterval);
                    timerInterval = null; }
                setTimeout(showTestResult, 500);
            }
        }

        function getQuestionTypeLabel(type) {
            const map = { 'fill_blank': '📝 选词填空', 'select_word': '🔍 选择单词', 'grammar': '🧩 语法选择' };
            return map[type] || '📝 选择题';
        }

        function selectTestOption(qIdx, value) {
            if (testSubmitted) return;
            if (testAnswers[qIdx] !== null) return;
            testAnswers[qIdx] = value;
            renderTest();
            const answeredCount = testAnswers.filter(a => a !== null).length;
            if (answeredCount === testQuestions.length && !testSubmitted) {
                testSubmitted = true;
                if (timerInterval) { clearInterval(timerInterval);
                    timerInterval = null; }
                setTimeout(showTestResult, 800);
            }
        }

        function showTestResult() {
            let correct = 0;
            testQuestions.forEach((q, idx) => { if (testAnswers[idx] === q.answer) correct++; });
            const total = testQuestions.length;
            const score = Math.round((correct / total) * 100);
            const resultHtml = `
                    <div class="test-result">
                        <div class="score">${score}</div>
                        <div class="score-label">总分 (${correct}/${total})</div>
                        <div class="score-detail">
                            ${score >= 60 ? '🎉 恭喜通过！' : '💪 继续加油！'}
                            <br>⏱️ 用时: ${document.getElementById('testTimer').textContent.replace('⏱️ ', '')}
                        </div>
                        <button class="btn btn-primary" onclick="startTest()">🔄 重新测试</button>
                    </div>
                `;
            const container = document.getElementById('testContainer');
            const existingResult = container.querySelector('.test-result');
            if (existingResult) { existingResult.outerHTML = resultHtml; } else { container.insertAdjacentHTML(
                    'afterbegin', resultHtml); }
            document.getElementById('testProgress').textContent = `${total} / ${total} 题 ✅ 完成`;
        }

        // ============================================================
        // 模式切换
        // ============================================================
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.mode-tab[data-mode="${mode}"]`)?.classList.add('active');
            document.getElementById('currentModeLabel').textContent = ['韩语→中文', '中文→韩语', '语音闪卡', '语法闪卡',
                '综合测试'
            ][mode] || '未知';

            const flashcardArea = document.getElementById('flashcardArea');
            const testArea = document.getElementById('testArea');
            const filterArea = document.getElementById('filterArea');
            const progressControls = document.getElementById('progressControls');

            if (mode === 4) {
                flashcardArea.classList.add('hidden');
                testArea.classList.remove('hidden');
                filterArea.style.display = 'none';
                progressControls.style.display = 'none';
                if (!testStarted) { startTest(); }
            } else {
                flashcardArea.classList.remove('hidden');
                testArea.classList.add('hidden');
                filterArea.style.display = 'flex';
                progressControls.style.display = 'flex';
                isFavPracticeMode = false;
                filteredItems = getItemsForMode(mode);
                currentIndex = 0;
                if (filteredItems.length > 0) { showCard(currentIndex); }
                updateStats();
            }
        }

        // ============================================================
        // 显示学习端
        // ============================================================
        function showStudy() {
            document.getElementById('studySection').style.display = 'block';
            populateFilters();
            setTimeout(() => {
                switchMode(0);
                renderFavList();
                updateStats();
            }, 50);
        }

        // ============================================================
        // 绑定事件
        // ============================================================
        function bindEvents() {
            // 闪卡操作
            document.getElementById('flipBtn').addEventListener('click', function(e) { e.stopPropagation();
                flipCard(); });
            document.getElementById('flipBackBtn').addEventListener('click', function(e) { e.stopPropagation();
                flipCard(); });
            document.getElementById('flashcard').addEventListener('click', function(e) {
                if (e.target.closest('.action-row') || e.target.closest('.speak-btn') || e.target.closest(
                        '.audio-only-icon')) return;
                flipCard();
            });

            document.getElementById('speakFrontBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                if (currentItem) VoiceEngine.speak(currentItem.korean).catch(() => {});
            });
            document.getElementById('speakBackBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                if (currentItem) VoiceEngine.speak(currentItem.korean).catch(() => {});
            });

            document.getElementById('favCardBtn').addEventListener('click', function(e) { e.stopPropagation();
                handleFavCard(); });
            document.getElementById('masteredBtn').addEventListener('click', function(e) { e.stopPropagation();
                handleMastered(); });
            document.getElementById('prevBtn').addEventListener('click', handlePrev);
            document.getElementById('nextBtn').addEventListener('click', handleNext);
            document.getElementById('resetBtn').addEventListener('click', handleReset);
            document.getElementById('advanceRoundBtn').addEventListener('click', handleAdvanceRound);

            document.getElementById('favPracticeBtn').addEventListener('click', startFavPractice);
            document.getElementById('clearFavBtn').addEventListener('click', clearFavorites);

            document.getElementById('topicFilter').addEventListener('change', function() {
                if (currentMode !== 4) {
                    filteredItems = getItemsForMode(currentMode);
                    showCard(0);
                }
            });
            document.getElementById('typeFilter').addEventListener('change', function() {
                if (currentMode !== 4) {
                    filteredItems = getItemsForMode(currentMode);
                    showCard(0);
                }
            });
            document.getElementById('favoriteFilter').addEventListener('change', function() {
                if (currentMode !== 4) {
                    filteredItems = getItemsForMode(currentMode);
                    showCard(0);
                }
            });

            document.getElementById('favToggleBtn').addEventListener('click', function() {
                const area = document.getElementById('favListArea');
                area.classList.toggle('show');
                if (area.classList.contains('show')) renderFavList();
            });

            document.querySelectorAll('.mode-tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    const mode = parseInt(this.dataset.mode);
                    switchMode(mode);
                });
            });

            document.getElementById('startTestBtn').addEventListener('click', startTest);
        }

        // ============================================================
        // 启动
        // ============================================================
        function init() {
            loadFavorites();
            loadMastered();
            showStudy();
        }

        // 启动
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                init();
                bindEvents();
                console.log('✅ 延世3 完整词库版已启动');
                console.log('📊 总词条:', allItems.length, ' (单词:', wordItems.length, '个, 语法:', grammarItems
                    .length, '个)');
            });
        } else {
            init();
            bindEvents();
            console.log('✅ 延世3 完整词库版已启动');
            console.log('📊 总词条:', allItems.length, ' (单词:', wordItems.length, '个, 语法:', grammarItems.length,
                '个)');
        }
    </script>
</body>
</html>
