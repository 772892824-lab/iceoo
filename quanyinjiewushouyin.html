    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif;
        }
        body {
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 30px 24px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a2b3c;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #6b7a8a;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .group-badge {
            display: inline-block;
            background: #eef2f6;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #1a2b3c;
            margin-bottom: 16px;
        }

        .card-container {
            perspective: 1200px;
            min-height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 16px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            min-height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            min-height: 300px;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 2px solid #e9edf2;
            background: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }
        .card-back {
            transform: rotateY(180deg);
            background: #f8fafc;
        }
        .card-face .main-char {
            font-size: 96px;
            font-weight: 700;
            color: #0f1e2e;
            line-height: 1.2;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif;
        }
        .card-face .hint {
            font-size: 14px;
            color: #8899aa;
            margin-top: 16px;
        }
        .card-face .action-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card-face .action-row .btn {
            padding: 8px 20px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background: #eef2f6;
            color: #1f2e3f;
            touch-action: manipulation;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: #1a2b3c;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #0f1e2e;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #d0d9e3;
        }
        .btn-outline:hover:not(:disabled) {
            background: #f2f6fc;
        }
        .btn-success {
            background: #2e7d5e;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #1f5f45;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px 30px;
            margin: 16px 0 8px;
            font-size: 13px;
            color: #4d6272;
        }
        .stats span {
            font-weight: 600;
            color: #1a2b3c;
        }
        .progress-text {
            font-size: 14px;
            color: #6b7a8a;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .card-face .main-char {
                font-size: 72px;
            }
            .card {
                min-height: 260px;
            }
            .card-face {
                min-height: 260px;
                padding: 20px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>

            { hangul: '숴', group: 'ㅅ' }, { hangul: '쇄', group: 'ㅅ' }, { hangul: '쉐', group: 'ㅅ' },
            { hangul: '쇠', group: 'ㅅ' }, { hangul: '쉬', group: 'ㅅ' }, { hangul: '싀', group: 'ㅅ' },

            // ㅆ 行
            { hangul: '싸', group: 'ㅆ' }, { hangul: '써', group: 'ㅆ' }, { hangul: '쏘', group: 'ㅆ' },
            { hangul: '쑤', group: 'ㅆ' }, { hangul: '씨', group: 'ㅆ' }, { hangul: '쓰', group: 'ㅆ' },
            { hangul: '쌔', group: 'ㅆ' }, { hangul: '쎄', group: 'ㅆ' }, { hangul: '쌰', group: 'ㅆ' },
            { hangul: '쎠', group: 'ㅆ' }, { hangul: '쑈', group: 'ㅆ' }, { hangul: '쓔', group: 'ㅆ' },
            { hangul: '썌', group: 'ㅆ' }, { hangul: '쎼', group: 'ㅆ' }, { hangul: '쏴', group: 'ㅆ' },
            { hangul: '쒀', group: 'ㅆ' }, { hangul: '쐐', group: 'ㅆ' }, { hangul: '쒜', group: 'ㅆ' },
            { hangul: '쐬', group: 'ㅆ' }, { hangul: '쒸', group: 'ㅆ' }, { hangul: '씌', group: 'ㅆ' },

            { hangul: '하', group: 'ㅎ' }, { hangul: '허', group: 'ㅎ' }, { hangul: '호', group: 'ㅎ' },
            { hangul: '후', group: 'ㅎ' }, { hangul: '히', group: 'ㅎ' }, { hangul: '흐', group: 'ㅎ' },
            { hangul: '해', group: 'ㅎ' }, { hangul: '헤', group: 'ㅎ' }, { hangul: '햐', group: 'ㅎ' },
            { hangul: '혀', group: 'ㅎ' }, { hangul: '효', group: 'ㅎ' }, { hangul: '휴', group: 'ㅎ' },
            { hangul: '햬', group: 'ㅎ' }, { hangul: '혜', group: 'ㅎ' }, { hangul: '화', group: 'ㅎ' },
            { hangul: '훠', group: 'ㅎ' }, { hangul: '홰', group: 'ㅎ' }, { hangul: '훼', group: 'ㅎ' },
            { hangul: '회', group: 'ㅎ' }, { hangul: '휘', group: 'ㅎ' }, { hangul: '희', group: 'ㅎ' },

            // ㅇ 行
            { hangul: '아', group: 'ㅇ' }, { hangul: '어', group: 'ㅇ' }, { hangul: '오', group: 'ㅇ' },
            { hangul: '우', group: 'ㅇ' }, { hangul: '이', group: 'ㅇ' }, { hangul: '으', group: 'ㅇ' },
            { hangul: '애', group: 'ㅇ' }, { hangul: '에', group: 'ㅇ' }, { hangul: '야', group: 'ㅇ' },
            { hangul: '여', group: 'ㅇ' }, { hangul: '요', group: 'ㅇ' }, { hangul: '유', group: 'ㅇ' },
            { hangul: '얘', group: 'ㅇ' }, { hangul: '예', group: 'ㅇ' }, { hangul: '와', group: 'ㅇ' },
            { hangul: '워', group: 'ㅇ' }, { hangul: '왜', group: 'ㅇ' }, { hangul: '웨', group: 'ㅇ' },
            { hangul: '외', group: 'ㅇ' }, { hangul: '위', group: 'ㅇ' }, { hangul: '의', group: 'ㅇ' }
        ];


        // ============================================================
        // 闪卡逻辑
        // ============================================================
        let items = [...PRONUNCIATION_DATA];
        let currentItem = null;
        let currentIndex = 0;
        let isFlipped = false;
        let masteredCount = 0;
        let masteredSet = new Set();

        const flashcard = document.getElementById('flashcard');
        const frontMain = document.getElementById('frontMain');
        const frontHint = document.getElementById('frontHint');
        const backMain = document.getElementById('backMain');
        const backHint = document.getElementById('backHint');
        const groupBadge = document.getElementById('groupBadge');

        const flipBtn = document.getElementById('flipBtn');
        const flipBackBtn = document.getElementById('flipBackBtn');
        const nextBtn = document.getElementById('nextBtn');
        const masterBtn = document.getElementById('masterBtn');
        const resetBtn = document.getElementById('resetBtn');

        const learnedCountEl = document.getElementById('learnedCount');
        const masteredCountEl = document.getElementById('masteredCount');
        const totalCountEl = document.getElementById('totalCount');
        const progressText = document.getElementById('progressText');

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getRandomItem() {
            const unmastered = items.filter((_, idx) => !masteredSet.has(idx));
            if (unmastered.length > 0) {
                const randomIdx = Math.floor(Math.random() * unmastered.length);
                const item = unmastered[randomIdx];
                const originalIdx = items.indexOf(item);
                return { item, index: originalIdx };
            } else {
                const idx = Math.floor(Math.random() * items.length);
                return { item: items[idx], index: idx };
            }
        }

        function showCard(item, index) {
            if (!item) {
                const random = getRandomItem();
                item = random.item;
                index = random.index;
            }
            currentItem = item;
            currentIndex = index;

            frontMain.textContent = item.hangul;
            backMain.textContent = '❓';
            frontHint.textContent = '👆 点击翻转';
            backHint.textContent = '👆 点击翻转返回';
            groupBadge.textContent = item.group + ' 行';

            isFlipped = false;
            flashcard.classList.remove('flipped');

            updateStats();
        }

        function showRandomCard() {
            const result = getRandomItem();
            showCard(result.item, result.index);
        }

        function flipCard() {
            isFlipped = !isFlipped;
            flashcard.classList.toggle('flipped');
        }

        function handleMastered() {
            if (!currentItem) return;
            const idx = currentIndex;
            if (masteredSet.has(idx)) {
                masteredSet.delete(idx);
                masteredCount--;
                masterBtn.textContent = '✅ 已掌握';
                masterBtn.style.background = '#2e7d5e';
            } else {
                masteredSet.add(idx);
                masteredCount++;
                masterBtn.textContent = '✅ 已掌握 ✓';
                masterBtn.style.background = '#1a5a3e';
            }
            updateStats();
            setTimeout(() => {
                masterBtn.textContent = '✅ 已掌握';
                masterBtn.style.background = '#2e7d5e';
            }, 600);
        }

        function updateStats() {
            const learned = items.length - (items.filter((_, idx) => !masteredSet.has(idx)).length);
            const total = items.length;

            learnedCountEl.textContent = learned;
            masteredCountEl.textContent = masteredCount;
            totalCountEl.textContent = total;

            const pct = total > 0 ? Math.round((masteredCount / total) * 100) : 0;
            const remaining = total - masteredCount;

            if (remaining === 0) {
                progressText.textContent = '🎉 全部掌握！点击「重置」重新开始';
            } else {
                progressText.textContent = `📖 剩余 ${remaining} 个未掌握 · 掌握率 ${pct}%`;
            }
        }

        function resetAll() {
            masteredSet.clear();
            masteredCount = 0;
            updateStats();
            showRandomCard();
            progressText.textContent = '🔄 已重置，重新开始练习！';
            setTimeout(() => {
                const remaining = items.length - masteredCount;
                progressText.textContent = `📖 剩余 ${remaining} 个未掌握 · 掌握率 0%`;
            }, 1200);
        }

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            shuffleArray(items);
            totalCountEl.textContent = items.length;
            showRandomCard();
            updateStats();

            flipBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                flipCard();
            });
            flipBackBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                flipCard();
            });
            flashcard.addEventListener('click', function(e) {
                if (e.target.closest('.action-row')) return;
                flipCard();
            });

            nextBtn.addEventListener('click', function() {
                if (isFlipped) flipCard();
                setTimeout(showRandomCard, 150);
            });

            masterBtn.addEventListener('click', function() {
                handleMastered();
            });

            resetBtn.addEventListener('click', function() {
                if (confirm('确定要重置所有进度吗？')) {
                    resetAll();
                }
            });

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    flipCard();
                }
                if (e.key === 'n' || e.key === 'N') {
                    if (isFlipped) flipCard();
                    setTimeout(showRandomCard, 150);
                }
                if (e.key === 'm' || e.key === 'M') {
                    handleMastered();
                }
            });

            console.log('✅ 韩语发音练习 (全音节) 已启动');
            console.log('📊 总音节数:', items.length);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
