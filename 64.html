<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韩语闯关 · 闪卡翻译</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Noto Sans KR', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #2b2d42 0%, #1d1f2c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 24px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), inset 0 0 1px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .level-nav {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 28px;
        }

        .level-btn {
            background: #252a3a;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #a7b0c0;
            cursor: pointer;
            box-shadow: 0 6px 0 #0f1118, 0 8px 16px rgba(0, 0, 0, 0.4);
            transition: all 0.1s ease;
            flex: 1;
            max-width: 220px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .level-btn.active {
            background: #4c6ef5;
            color: white;
            box-shadow: 0 6px 0 #2c3e9e, 0 8px 16px #1a1f3a;
            transform: translateY(-2px);
        }

        .level-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f1118;
        }

        .card-area {
            background: #1b1e2b;
            border-radius: 40px;
            padding: 28px 20px 20px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), inset 0 12px 24px rgba(0, 0, 0, 0.6);
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* ========== 第一关 闪卡 ========== */
        .flashcard-wrapper {
            perspective: 1200px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            min-height: 320px;
            transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            border-radius: 36px;
            box-shadow: 0 18px 30px -8px black;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            min-height: 320px;
            backface-visibility: hidden;
            border-radius: 36px;
            padding: 28px 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #212536;
            background-image: radial-gradient(circle at 20% 30%, #2e3348, #191c28);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7);
        }

        .card-front {
            transform: rotateY(0deg);
        }

        .card-back {
            transform: rotateY(180deg);
            background: #1e212f;
            background-image: radial-gradient(circle at 80% 20%, #2f354a, #14161f);
        }

        .prompt-ko {
            font-size: 3.8rem;
            font-weight: 800;
            color: #f0e9d8;
            text-shadow: 0 6px 0 #0b0d12, 0 12px 20px black;
            letter-spacing: 4px;
            line-height: 1.3;
            text-align: center;
            word-break: keep-all;
        }

        .prompt-zh {
            font-size: 3rem;
            font-weight: 700;
            color: #bac8ff;
            text-shadow: 0 6px 0 #0b0d12, 0 12px 20px black;
            text-align: center;
            word-break: keep-all;
        }

        .prompt-audio {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .prompt-audio .big-icon {
            font-size: 6rem;
            filter: drop-shadow(0 10px 6px black);
            animation: pulse 1.4s infinite ease-in-out;
        }

        .prompt-audio .audio-label {
            font-size: 1.3rem;
            color: #8f9bb3;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: #1a1d29;
            padding: 10px 26px;
            border-radius: 50px;
            border: 1px solid #3b4259;
            box-shadow: inset 0 2px 6px black;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.12); opacity: 1; }
        }

        .answer-ko {
            font-size: 3.2rem;
            font-weight: 800;
            color: #f0e9d8;
            text-shadow: 0 6px 0 #0b0d12, 0 12px 20px black;
            letter-spacing: 3px;
            line-height: 1.3;
            text-align: center;
            word-break: keep-all;
        }

        .answer-zh {
            font-size: 2.4rem;
            font-weight: 600;
            color: #bac8ff;
            text-shadow: 0 3px 0 #0b0d12;
            margin-top: 16px;
            text-align: center;
        }

        .hint {
            color: #8f9bb3;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .type-badge {
            position: absolute;
            top: 18px;
            right: 24px;
            background: #2b3143;
            color: #96a0b5;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 30px;
            letter-spacing: 1px;
            border: 1px solid #4a5169;
        }

        /* ========== 第二关 翻译题 ========== */
        .translation-wrapper {
            perspective: 1200px;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            cursor: pointer;
        }

        .translation-card {
            position: relative;
            width: 100%;
            min-height: 440px;
            transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            border-radius: 36px;
            box-shadow: 0 18px 30px -8px black;
        }

        .translation-card.flipped {
            transform: rotateY(180deg);
        }

        .translation-face {
            position: absolute;
            width: 100%;
            height: 100%;
            min-height: 440px;
            backface-visibility: hidden;
            border-radius: 36px;
            padding: 30px 26px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #212536;
            background-image: radial-gradient(circle at 20% 30%, #2e3348, #191c28);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7);
        }

        .translation-front {
            transform: rotateY(0deg);
        }

        .translation-back {
            transform: rotateY(180deg);
            background: #1e212f;
            background-image: radial-gradient(circle at 80% 20%, #2f354a, #14161f);
            justify-content: center;
            align-items: center;
        }

        .translation-words {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .translation-word {
            background: #4c6ef5;
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            padding: 12px 26px;
            border-radius: 100px;
            box-shadow: 0 6px 0 #2639a3, 0 8px 16px black;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 #1a237e;
        }

        .translation-direction {
            font-size: 0.95rem;
            color: #8f9bb3;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 16px;
            background: #1a1d29;
            padding: 8px 22px;
            border-radius: 40px;
            display: inline-block;
            align-self: center;
            border: 1px solid #3b4259;
        }

        .translation-prompt {
            font-size: 1.5rem;
            font-weight: 600;
            color: #e6e9f0;
            text-align: center;
            line-height: 1.8;
            padding: 22px 20px;
            background: #13161f;
            border-radius: 28px;
            border: 1px solid #3b4259;
            box-shadow: inset 0 0 16px #05070c;
            word-break: keep-all;
        }

        .translation-prompt .example-ko {
            font-size: 1.7rem;
            color: #f0e9d8;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
            text-shadow: 0 2px 0 #0b0d12;
        }

        .translation-prompt .example-zh {
            font-size: 1.4rem;
            color: #bac8ff;
            display: block;
            margin-top: 10px;
            line-height: 1.9;
        }

        .translation-answer {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f0e9d8;
            text-align: center;
            line-height: 1.7;
            padding: 24px 18px;
            background: #13161f;
            border-radius: 28px;
            border: 1px solid #4c5670;
            box-shadow: inset 0 0 20px #05070c;
            word-break: keep-all;
            text-shadow: 0 3px 0 #0b0d12;
        }

        .translation-answer-label {
            font-size: 1rem;
            color: #8f9bb3;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
            background: #1a1d29;
            padding: 8px 22px;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #3b4259;
        }

        /* 共用按钮 */
        .center {
            text-align: center;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid #3f465c;
            color: #96a0b5;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }

        .reset-btn:hover {
            background: #2e3348;
            color: white;
        }

        .correction-badge {
            background: #1e3a2e;
            color: #9ae6b4;
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.9rem;
            margin-bottom: 14px;
            text-align: center;
            border-left: 6px solid #37b24d;
        }

        .hidden {
            display: none !important;
        }

        .progress-info {
            text-align: center;
            color: #8f9bb3;
            font-size: 0.95rem;
            margin-top: 18px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="level-nav">
        <button class="level-btn active" id="level1Btn">📇 第一关 · 闪卡</button>
        <button class="level-btn" id="level2Btn">🌐 第二关 · 翻译</button>
    </div>

    <!-- 第一关 闪卡区域 -->
    <div id="level1Panel" class="card-area">
        <div class="correction-badge">
            ✅ 单词已校对 · 闪卡随机出现：韩语 / 中文 / 纯语音
        </div>
        <div class="flashcard-wrapper" id="flashcardWrapper">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front" id="cardFront">
                    <div class="type-badge" id="typeBadge">韩语</div>
                </div>
                <div class="card-face card-back">
                    <div class="answer-ko" id="answerKo">선정하다</div>
                    <div class="answer-zh" id="answerZh">选定</div>
                    <div class="hint">点击返回正面</div>
                </div>
            </div>
        </div>
        <div class="center" style="margin-top: 20px;">
            <button class="reset-btn" id="resetFlashcardBtn">🔄 重新开始闪卡</button>
            <button class="reset-btn" id="nextCardBtn" style="margin-left: 12px;">⏩ 下一张</button>
        </div>
    </div>

    <!-- 第二关 翻译区域 -->
    <div id="level2Panel" class="card-area hidden">
        <div class="correction-badge">
            🌐 翻译练习 · 韩→中 给例句 / 中→韩 长句翻译
        </div>
        <div class="translation-wrapper" id="translationWrapper">
            <div class="translation-card" id="translationCard">
                <!-- 正面 -->
                <div class="translation-face translation-front" id="translationFront">
                    <div class="translation-words" id="translationWords"></div>
                    <div class="translation-direction" id="translationDirection">翻译成中文</div>
                    <div class="translation-prompt" id="translationPrompt"></div>
                    <div class="hint">点击卡片查看答案</div>
                </div>
                <!-- 反面 -->
                <div class="translation-face translation-back">
                    <div class="translation-answer-label">正确答案</div>
                    <div class="translation-answer" id="translationAnswer"></div>
                    <div class="hint">点击返回正面</div>
                </div>
            </div>
        </div>
        <div class="center" style="margin-top: 20px;">
            <button class="reset-btn" id="resetTranslationBtn">🔄 重新开始翻译</button>
            <button class="reset-btn" id="nextTranslationBtn" style="margin-left: 12px;">⏩ 下一题</button>
        </div>
        <div class="progress-info" id="translationProgress"></div>
    </div>
</div>

<script>
    // ==================== 校对后的单词表 ====================
    const wordPairs = [
        { ko: '선정하다', zh: '选定' },
        { ko: '수월해지다', zh: '变得轻松' },
        { ko: '취재', zh: '采访' },
        { ko: '브랜드', zh: '品牌' },
        { ko: '심다', zh: '种，栽' },
        { ko: '경계선', zh: '分界线' },
        { ko: '고대 문자', zh: '古文字' },
        { ko: '개론', zh: '概论' },
        { ko: '과열되다', zh: '过热' },
        { ko: '개방', zh: '开放' },
        { ko: '차례', zh: '回，次' },
        { ko: '불상사', zh: '不幸事故' },
        { ko: '색다르다', zh: '特殊的' },
        { ko: '증상', zh: '症状' },
        { ko: '설정하다', zh: '设定' },
        { ko: '먹잇감', zh: '饲料' },
        { ko: '땅', zh: '土地' },
        { ko: '몰다', zh: '赶，驾驶，骑，集拢视为' },
        { ko: '사냥하다', zh: '捕猎' },
        { ko: '동작', zh: '动作' },
        { ko: '망치다', zh: '搞砸' },
        { ko: '내비게이션', zh: '导航' },
        { ko: '이미지', zh: '形象' },
        { ko: '긋다', zh: '画，记账，暂避，暂停' },
        { ko: '의존하다', zh: '依赖' },
        { ko: '친목', zh: '亲睦' },
        { ko: '원활하다', zh: '顺利进行' },
        { ko: '추락', zh: '坠落' },
        { ko: '송년회', zh: '年会' },
        { ko: '무너지다', zh: '倒塌' },
        { ko: '목숨', zh: '生命' },
        { ko: '착성', zh: '制定' },
        { ko: '해석하다', zh: '解释' },
        { ko: '승객', zh: '乘客' },
        { ko: '남기다', zh: '留下' },
        { ko: '비교적', zh: '相对' },
        { ko: '건지다', zh: '打捞，救回' },
        { ko: '이벤트', zh: '活动' },
        { ko: '수정하다', zh: '修正' },
        { ko: '침묵', zh: '沉默' },
        { ko: '성향', zh: '倾向' },
        { ko: '날개', zh: '翅膀，风扇叶片' },
        { ko: '깨다', zh: '打破' },
        { ko: '분석하다', zh: '分析' },
        { ko: '명명되다', zh: '被命名' },
        { ko: '부인', zh: '否认' },
        { ko: '지정하다', zh: '指定' },
        { ko: '앞장서다', zh: '领头' },
        { ko: '귀환하다', zh: '归还' },
        { ko: '화제', zh: '话题' },
        { ko: '가로', zh: '横向' },
        { ko: '기르다', zh: '培养' },
        { ko: '소방관', zh: '消防员' },
        { ko: '세로', zh: '竖向' },
        { ko: '단위', zh: '单位' },
        { ko: '전공을 살리다', zh: '活用专业' },
        { ko: '비유하다', zh: '比喻' },
        { ko: '실천', zh: '实行' },
        { ko: '희생정신', zh: '牺牲精神' },
        { ko: '차량', zh: '车辆' },
        { ko: '달성하다', zh: '达成' },
        { ko: '시각', zh: '视角' },
        { ko: '특정', zh: '特定' },
        { ko: '무지개', zh: '彩虹' },
        { ko: '권장하다', zh: '提倡' },
        { ko: '집중하다', zh: '集中' },
        { ko: '굴절되다', zh: '弯曲，折射' },
        { ko: '하긴', zh: '没错' },
        { ko: '분산하다', zh: '分散' },
        { ko: '섞다', zh: '混合' },
        { ko: '요약본', zh: '摘要' },
        { ko: '단기적', zh: '短期的' },
        { ko: '목돈', zh: '大笔钱' },
        { ko: '측정하다', zh: '测量' },
        { ko: '장비', zh: '设备' },
        { ko: '은퇴', zh: '退休' },
        { ko: '충족하다', zh: '满足' },
        { ko: '더해지다', zh: '加上' },
        { ko: '유용하다', zh: '有用' },
        { ko: '정밀하다', zh: '精密' },
        { ko: '궁중', zh: '宫廷' },
        { ko: '효율적', zh: '高效的' },
        { ko: '첨단', zh: '先进' },
        { ko: '손상되다', zh: '被损伤' },
        { ko: '문화재', zh: '文物' }
    ];

    // ==================== 第一关 闪卡 ====================
    const flashcard = document.getElementById('flashcard');
    const cardFront = document.getElementById('cardFront');
    const answerKo = document.getElementById('answerKo');
    const answerZh = document.getElementById('answerZh');
    const flashcardWrapper = document.getElementById('flashcardWrapper');
    const nextCardBtn = document.getElementById('nextCardBtn');
    const resetFlashcardBtn = document.getElementById('resetFlashcardBtn');

    const CARD_TYPES = ['ko', 'zh', 'audio'];
    let currentCardIndex = 0;
    let cardFlipped = false;
    let cardOrder = [];
    let currentCardType = 'ko';

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initCardOrder() {
        cardOrder = shuffleArray(Array.from({ length: wordPairs.length }, (_, i) => i));
        currentCardIndex = 0;
    }

    function randomCardType() {
        return CARD_TYPES[Math.floor(Math.random() * CARD_TYPES.length)];
    }

    function speakKorean(text) {
        if (!('speechSynthesis' in window)) {
            console.warn('浏览器不支持语音合成');
            return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.85;
        utterance.pitch = 1;
        const voices = window.speechSynthesis.getVoices();
        const koreanVoice = voices.find(v => v.lang === 'ko-KR' || v.lang.startsWith('ko'));
        if (koreanVoice) utterance.voice = koreanVoice;
        window.speechSynthesis.speak(utterance);
    }

    function renderCardFront(type, pair) {
        cardFront.innerHTML = '';
        const badge = document.createElement('div');
        badge.className = 'type-badge';
        badge.id = 'typeBadge';

        if (type === 'ko') {
            badge.textContent = '韩语';
            cardFront.appendChild(badge);
            const koDiv = document.createElement('div');
            koDiv.className = 'prompt-ko';
            koDiv.textContent = pair.ko;
            cardFront.appendChild(koDiv);
            const hint = document.createElement('div');
            hint.className = 'hint';
            hint.textContent = '点击卡片查看答案';
            cardFront.appendChild(hint);
        } else if (type === 'zh') {
            badge.textContent = '中文';
            cardFront.appendChild(badge);
            const zhDiv = document.createElement('div');
            zhDiv.className = 'prompt-zh';
            zhDiv.textContent = pair.zh;
            cardFront.appendChild(zhDiv);
            const hint = document.createElement('div');
            hint.className = 'hint';
            hint.textContent = '点击卡片查看答案';
            cardFront.appendChild(hint);
        } else if (type === 'audio') {
            badge.textContent = '语音';
            cardFront.appendChild(badge);
            const audioDiv = document.createElement('div');
            audioDiv.className = 'prompt-audio';
            audioDiv.innerHTML = `
                <div class="big-icon">🔊</div>
                <div class="audio-label">点击卡片重播</div>
            `;
            cardFront.appendChild(audioDiv);
            setTimeout(() => speakKorean(pair.ko), 150);
        }
    }

    function loadCard(index, forceNewType = false) {
        if (!cardOrder.length) initCardOrder();
        const actualIndex = cardOrder[index % cardOrder.length];
        const pair = wordPairs[actualIndex];

        currentCardType = randomCardType();

        answerKo.textContent = pair.ko;
        answerZh.textContent = pair.zh;

        renderCardFront(currentCardType, pair);

        if (cardFlipped) {
            flashcard.classList.remove('flipped');
            cardFlipped = false;

    function flipCard() {
        flashcard.classList.toggle('flipped');
        cardFlipped = flashcard.classList.contains('flipped');
        if (!cardFlipped && currentCardType === 'audio') {
            const actualIndex = cardOrder[currentCardIndex % cardOrder.length];
            const pair = wordPairs[actualIndex];
            setTimeout(() => speakKorean(pair.ko), 100);
        }
    }

        if (e.target.closest('.prompt-audio') && currentCardType === 'audio') {
            e.stopPropagation();
            const actualIndex = cardOrder[currentCardIndex % cardOrder.length];
            const pair = wordPairs[actualIndex];
            speakKorean(pair.ko);
            return;
        }
        flipCard();
    });

        currentCardIndex = (currentCardIndex + 1) % wordPairs.length;
        loadCard(currentCardIndex, true);

        { words: ['기르다'], zhPrompt: '从很小的时候就开始培养阅读的习惯，这是一件非常重要的事情。', koAnswer: '어릴 때부터 독서 습관을 기르는 것이 중요하다.' },
        { words: ['소방관'], zhPrompt: '消防员们在火灾现场把市民们安全地疏散了出去。', koAnswer: '소방관들은 화재 현장에서 시민들을 안전하게 대피시켰다.' },
        { words: ['세로'], zhPrompt: '那栋建筑被设计得竖向细长，因此给人留下了一种独特的印象。', koAnswer: '그 건물은 세로로 길쭉하게 설계되어 독특한 인상을 준다.' },
        { words: ['단위'], zhPrompt: '这座城市的人口是以百万为单位来进行计算的。', koAnswer: '이 도시의 인구는 백만 단위로 계산된다.' },
        { words: ['전공을 살리다'], zhPrompt: '他活用自己所学的专业，在相关领域的公司里就了业。', koAnswer: '그는 전공을 살려서 관련 분야의 회사에 취직했다.' },
        { words: ['비유하다'], zhPrompt: '诗人把人生比喻成了一段漫长的旅行，并以此来加以表达。', koAnswer: '시인은 인생을 긴 여행에 비유하여 표현했다.' },
        { words: ['실천'], zhPrompt: '无论多么好的理论，如果不付诸实践的话，也是毫无用处的。', koAnswer: '아무리 좋은 이론도 실천으로 옮기지 않으면 아무 소용이 없다.' },
        { words: ['희생정신'], zhPrompt: '那位医生的牺牲精神，给许许多多的人带来了深深的感动。', koAnswer: '그 의사의 희생정신은 많은 사람들에게 깊은 감동을 주었다.' },
        { words: ['차량'], zhPrompt: '上班时间路上的车辆实在太多了，简直动弹不得。', koAnswer: '출근 시간에는 도로에 차량이 너무 많아서 꼼짝도 못 한다.' },
        { words: ['달성하다'], zhPrompt: '他终于达成了长久以来一直梦想着的那个目标。', koAnswer: '그는 마침내 오랜 꿈이었던 목표를 달성했다.' },
        { words: ['시각'], zhPrompt: '看待同一件事情的视角，可能会因人而有所不同。', koAnswer: '같은 사건을 바라보는 시각이 사람마다 다를 수 있다.' },
        { words: ['특정'], zhPrompt: '应当尽量避免针对特定个人所进行的指责。', koAnswer: '특정 개인을 겨냥한 비난은 삼가야 한다.' },
        { words: ['무지개'], zhPrompt: '雨停之后，天空中出现了一道七种颜色的彩虹。', koAnswer: '비가 그친 뒤 하늘에 일곱 빛깔 무지개가 떴다.' },
        { words: ['권장하다'], zhPrompt: '专家们提倡大家进行有规律的运动。', koAnswer: '전문가들은 규칙적인 운동을 권장한다.' },
        { words: ['집중하다'], zhPrompt: '他不顾周围的噪音，专注于学习。', koAnswer: '그는 주변 소음에도 아랑곳하지 않고 공부에 집중했다.' },
        { words: ['굴절되다'], zhPrompt: '光线在进入水中的时候，看起来被折射了。', koAnswer: '빛이 물속으로 들어가면서 굴절되어 보였다.' },
        { words: ['하긴'], zhPrompt: '没错，既然那么努力了，结果好也是理所当然的。', koAnswer: '하긴, 그렇게 열심히 했는데 결과가 좋을 만도 하지.' },
        { words: ['분산하다'], zhPrompt: '为了分散风险，最好在多个不同的地方进行投资。', koAnswer: '위험을 분산하기 위해 여러 곳에 투자하는 것이 바람직하다.' },
        { words: ['섞다'], zhPrompt: '他把好几种颜色混合在了一起，最终完成了一幅美丽的画作。', koAnswer: '그는 여러 가지 색을 섞어서 아름다운 그림을 완성했다.' },
        { words: ['요약본'], zhPrompt: '先读一遍报告摘要，然后再把握整体内容，这样比较好。', koAnswer: '보고서 요약본을 먼저 읽고 전체 내용을 파악하는 것이 좋다.' },
        { words: ['단기적'], zhPrompt: '比起短期的利益，更应该考虑长期的发展。', koAnswer: '단기적 이익보다 장기적 발전을 고려해야 한다.' },
        { words: ['목돈'], zhPrompt: '他用长时间积攒下来的大笔钱，开了一家小小的店铺。', koAnswer: '그는 오랜 시간 모은 목돈으로 작은 가게를 열었다.' },
        { words: ['측정하다'], zhPrompt: '利用机器精确地测量了温度。', koAnswer: '기계를 이용하여 정확하게 온도를 측정했다.' },
        { words: ['장비'], zhPrompt: '去登山之前，仔细准备好了必要的装备。', koAnswer: '등산을 하기 전에 필요한 장비를 꼼꼼히 챙겼다.' },
        { words: ['은퇴'], zhPrompt: '他服满退休年龄退休之后，回到了自己的故乡。', koAnswer: '그는 정년을 채우고 은퇴한 후 고향으로 내려갔다.' },
        { words: ['충족하다'], zhPrompt: '那位应聘者满足了所有的条件，最终被合格录取了。', koAnswer: '그 지원자는 모든 조건을 충족하여 최종 합격했다.' },
        { words: ['더해지다'], zhPrompt: '在这里又加上了一个问题，于是情况变得更加复杂了。', koAnswer: '여기에 또 하나의 문제가 더해져서 상황이 더욱 복잡해졌다.' },
        { words: ['유용하다'], zhPrompt: '这本书里面包含了在日常生活中非常有用的信息。', koAnswer: '이 책은 일상생활에서 매우 유용한 정보를 담고 있다.' },
        { words: ['정밀하다'], zhPrompt: '这块手表是用精密的技术制造出来的，所以几乎没有误差。', koAnswer: '이 시계는 정밀한 기술로 만들어져 오차가 거의 없다.' },
        { words: ['궁중'], zhPrompt: '宫廷文化和普通百姓的生活有着非常大的不同。', koAnswer: '궁중 문화는 일반 백성들의 생활과는 매우 달랐다.' },
        { words: ['효율적'], zhPrompt: '如果用高效的方法来处理事情，就能够节省时间。', koAnswer: '효율적인 방법으로 일을 처리하면 시간을 절약할 수 있다.' },
        { words: ['첨단'], zhPrompt: '这家工厂引进了先进的技术，从而大大提高了生产率。', koAnswer: '이 공장은 첨단 기술을 도입하여 생산성을 크게 높였다.' },
        { words: ['손상되다'], zhPrompt: '随着漫长岁月的流逝，文物被损伤了很多。', koAnswer: '오랜 세월이 지나면서 문화재가 많이 손상되었다.' },
        { words: ['문화재'], zhPrompt: '我们有义务好好地保存珍贵的文物。', koAnswer: '우리는 소중한 문화재를 잘 보존해야 할 의무가 있다.' }
    ];

    // 合并题库并打乱
    const translationQuestions = [];
    koToZhQuestions.forEach((q) => {
        translationQuestions.push({
            words: q.words,
            direction: 'ko',
            prompt: q.koExample,
            answer: q.zhAnswer,
            type: 'koToZh'
        });
    });
    zhToKoQuestions.forEach((q) => {
        translationQuestions.push({
            words: q.words,
            direction: 'zh',
            prompt: q.zhPrompt,
            answer: q.koAnswer,
            type: 'zhToKo'
        });
    });

    shuffleArray(translationQuestions);

    let translationIndex = 0;
    let translationCardFlipped = false;

    const translationCard = document.getElementById('translationCard');
    const translationWords = document.getElementById('translationWords');
    const translationDirection = document.getElementById('translationDirection');
    const translationPrompt = document.getElementById('translationPrompt');
    const translationAnswer = document.getElementById('translationAnswer');
    const translationWrapper = document.getElementById('translationWrapper');
    const nextTranslationBtn = document.getElementById('nextTranslationBtn');
    const resetTranslationBtn = document.getElementById('resetTranslationBtn');
    const translationProgress = document.getElementById('translationProgress');

    function loadTranslation(index) {
        const q = translationQuestions[index % translationQuestions.length];

        translationWords.innerHTML = '';
        q.words.forEach(w => {
            const span = document.createElement('span');
            span.className = 'translation-word';
            span.textContent = w;
            translationWords.appendChild(span);
        });

        if (q.direction === 'ko') {
            translationDirection.textContent = '韩语 → 中文（翻译例句）';
            translationPrompt.innerHTML = `<span class="example-ko">${q.prompt}</span>`;
        } else {
            translationDirection.textContent = '中文 → 韩语（用单词翻译长句）';
            translationPrompt.innerHTML = `<span class="example-zh">${q.prompt}</span>`;
        }

        translationAnswer.textContent = q.answer;

        if (translationCardFlipped) {
            translationCard.classList.remove('flipped');
            translationCardFlipped = false;
        }

        translationProgress.textContent = `第 ${(index % translationQuestions.length) + 1} / ${translationQuestions.length} 题`;
    }

    function flipTranslation() {
        translationCard.classList.toggle('flipped');
        translationCardFlipped = translationCard.classList.contains('flipped');
    }

    translationWrapper.addEventListener('click', (e) => {
        if (e.target.closest('.reset-btn')) return;
        flipTranslation();
    });

    nextTranslationBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        translationIndex = (translationIndex + 1) % translationQuestions.length;
        loadTranslation(translationIndex);
    });

    resetTranslationBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        translationIndex = 0;
        shuffleArray(translationQuestions);
        loadTranslation(translationIndex);
    });

    // ==================== 关卡切换 ====================
    const level1Btn = document.getElementById('level1Btn');
    const level2Btn = document.getElementById('level2Btn');
    const level1Panel = document.getElementById('level1Panel');
    const level2Panel = document.getElementById('level2Panel');

    function showLevel(level) {
        if (level === 1) {
            level1Panel.classList.remove('hidden');
            level2Panel.classList.add('hidden');
            level1Btn.classList.add('active');
            level2Btn.classList.remove('active');
        } else {
            level1Panel.classList.add('hidden');
            level2Panel.classList.remove('hidden');
            level1Btn.classList.remove('active');
            level2Btn.classList.add('active');
            loadTranslation(translationIndex);
        }
    }

    level1Btn.addEventListener('click', () => showLevel(1));
    level2Btn.addEventListener('click', () => showLevel(2));

    // ==================== 初始化 ====================
    initCardOrder();
    loadCard(0, true);
    loadTranslation(0);

    window.speechSynthesis.getVoices();
    showLevel(1);
</script>
</body>
</html>
